name: pytest canary

# The main workflow runs the pinned pytest from requirements.txt. This one runs
# the newest release, so a pytest change that would flip an invariant row shows
# up here first, as a red run, instead of silently on the next pin bump.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  latest-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --upgrade pytest
      - run: python -m pytest --version
      - name: harness tests
        run: python -m pytest tests -q
      - name: invariant matrix
        run: python -m gg invariants
