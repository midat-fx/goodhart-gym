name: invariants

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and the
        # matrix should change only when this file does. The canary stays on
        # -latest, so the move shows up there first.
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: harness tests
        run: python -m pytest tests -q
      - name: every reference passes both verifiers, every exploit passes naive and fails sealed
        run: python -m gg invariants

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the reproducible task environment
        run: docker build -t goodhart-gym:ci .
      - name: Run without network access
        run: docker run --rm --network none goodhart-gym:ci
